name: CI
permissions:
  contents: read

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  test-format-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.1.3
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun ci

      - name: Biome CI
        run: bunx biome ci

      - name: Bun Test With Coverage
        run: bun test --coverage --coverage-reporter=lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2 # Apparently, you don't need to explicitly tell codecov the coverage files and token anymore. this is all you need.
